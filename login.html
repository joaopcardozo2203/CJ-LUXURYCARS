<!DOCTYPE html>
<html lang="pt-BR">
  <head>
     <head>
    <head>
    <meta charset="UTF-8">
    <title>CJ LUXURYCARS</title>

    <!-- Cole aqui -->
    <link rel="icon" type="image/png" href="/cj-luxurycars/imagens/logo.png">
</head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CJ LUXURYCARS | Portal VIP</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Montserrat:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./CSS/login.css" />
    <style>
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <a href="index.html" class="btn-back-top">← VOLTAR À LOJA</a>

    <div class="auth-card-container">
      <a href="index.html" class="brand-logo">CJ <span>LUXURY</span>CARS</a>
      <span class="brand-subtitle">PORTAL EXCLUSIVO DE MEMBROS</span>

      <!-- Botões de Alternância -->
      <div class="tab-navigation">
        <button type="button" class="tab-btn active-tab" id="show-login">
          ENTRAR
        </button>
        <button type="button" class="tab-btn" id="show-register">
          CADASTRAR
        </button>
      </div>

      <!-- Seção de Login -->
      <div id="login-section">
        <form id="form-login" class="auth-form active-form">
          <div class="input-group">
            <label for="login-usuario">Usuário ou E-mail VIP</label>
            <input
              type="text"
              id="login-usuario"
              required
              placeholder="seu.usuario"
            />
          </div>

          <div class="input-group">
            <label for="login-senha">Senha de Acesso</label>
            <div class="password-container">
              <input
                type="password"
                id="login-senha"
                required
                placeholder="••••••••"
              />
              <button
                type="button"
                class="toggle-password-btn"
                onclick="toggleVisibilidadeSenha('login-senha', this)"
              >
                <svg class="icon-eye-open" viewBox="0 0 24 24">
                  <path
                    d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"
                  />
                </svg>
                <svg class="icon-eye-off" viewBox="0 0 24 24">
                  <path
                    d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"
                  />
                </svg>
              </button>
            </div>
          </div>

          <div
            id="login-message"
            style="font-size: 0.8rem; margin-top: 5px; text-align: center"
          ></div>
          <button type="submit" class="btn-gold-submit">
            ACESSAR GARAGEM VIP
          </button>
        </form>
      </div>

      <!-- Seção de Cadastro -->
      <div id="register-section" class="hidden">
        <form id="form-register" class="auth-form active-form">
          <div class="input-group">
            <label for="register-name">Nome Completo</label>
            <input
              type="text"
              id="register-name"
              required
              placeholder="Seu nome completo"
            />
          </div>

          <div class="input-group">
            <label for="register-username">Nome de Usuário</label>
            <input
              type="text"
              id="register-username"
              required
              placeholder="ex: joao.silva"
            />
          </div>

          <div class="input-group">
            <label for="register-password">Criar Senha</label>
            <div class="password-container">
              <input
                type="password"
                id="register-password"
                minlength="6"
                required
                placeholder="Mínimo 6 caracteres"
              />
              <button
                type="button"
                class="toggle-password-btn"
                onclick="toggleVisibilidadeSenha('register-password', this)"
              >
                <svg class="icon-eye-open" viewBox="0 0 24 24">
                  <path
                    d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"
                  />
                </svg>
                <svg class="icon-eye-off" viewBox="0 0 24 24">
                  <path
                    d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"
                  />
                </svg>
              </button>
            </div>
          </div>

          <div
            id="register-message"
            style="font-size: 0.8rem; margin-top: 5px; text-align: center"
          ></div>
          <button type="submit" class="btn-gold-submit">CRIAR CONTA VIP</button>
        </form>
      </div>
    </div>

    <script type="module" src="JS/auth.js"></script>
  </body>
</html>
